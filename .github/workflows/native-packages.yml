name: Native packages

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-packages.yml"
      - "src/**"
      - "package.json"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Live console URL the native shells should open"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  AETHER_APP_URL: ${{ inputs.app_url || vars.AETHER_APP_URL || 'https://aether-global-uap-tracker.vercel.app' }}

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stamp console URL
        run: printf '%s\n' "$AETHER_APP_URL" > native/app-url.txt

      - name: Assemble release APK
        working-directory: native/android
        run: gradle assembleRelease -PAETHER_APP_URL="$AETHER_APP_URL" --no-daemon

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp native/android/app/build/outputs/apk/release/app-release.apk dist/AETHER-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-android-apk
          path: dist/AETHER-1.0.0.apk
          if-no-files-found: error

  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp console URL
        shell: bash
        run: |
          printf '%s\n' "$AETHER_APP_URL" > native/app-url.txt
          cp native/app-url.txt native/desktop/app-url.txt

      - name: Install Electron builder
        working-directory: native/desktop
        run: npm install

      - name: Build NSIS installer
        working-directory: native/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          AETHER_APP_URL: ${{ env.AETHER_APP_URL }}
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-windows-exe
          path: native/desktop/dist/*.exe
          if-no-files-found: error

  ios-ipa:
    name: iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Stamp console URL
        run: printf '%s\n' "$AETHER_APP_URL" > native/app-url.txt

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: native/ios
        run: |
          URL="$AETHER_APP_URL"
          xcodebuild \
            -project Aether.xcodeproj \
            -scheme Aether \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            AETHER_APP_URL="$URL" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find native/ios/build -name "Aether.app" -type d | head -n 1)
          test -n "$APP"
          mkdir -p Payload dist
          cp -R "$APP" Payload/AETHER.app
          zip -r dist/AETHER-1.0.0.ipa Payload
          zip -r dist/AETHER-ios-simulator.app.zip Payload/AETHER.app

      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-ios-ipa
          path: |
            dist/AETHER-1.0.0.ipa
            dist/AETHER-ios-simulator.app.zip
          if-no-files-found: error

  release-bundle:
    name: Attach to GitHub Release
    needs: [android-apk, windows-exe, ios-ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.ipa' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: native-latest
          name: Native packages
          body: |
            Sideloadable AETHER shells. They open the live console at `${{ env.AETHER_APP_URL }}`.

            - **AETHER-1.0.0.apk** — Android (debug-signed, installable)
            - **AETHER-Setup-1.0.0.exe** — Windows installer
            - **AETHER-1.0.0.ipa** — iOS (unsigned simulator/device archive; sign with your Apple team to install on a phone)
          files: out/*
          draft: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
